[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "insightflow"
version = "0.1.0"
description = "InsightFlow AI - desktop intelligence and content automation platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "InsightFlow AI" }]
dependencies = [
    "PySide6>=6.7",
    "google-api-python-client>=2.100",
    "google-auth>=2.28",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "keyring>=25",
    "boto3>=1.34",
    "windows-toasts>=1.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "mypy>=1.15",
]

[project.scripts]
insightflow = "insightflow.bootstrap.startup:main"
insightflow-agent = "insightflow.bootstrap.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/insightflow"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["docs", "migrations", "assets", "build", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["insightflow"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["comparison-overlap", "unreachable"]

# Official Google client libraries ship without complete type stubs.
[[tool.mypy.overrides]]
module = [
    "google.*",
    "google_auth_oauthlib.*",
    "googleapiclient.*",
]
ignore_missing_imports = true

# boto3/botocore ship without complete type stubs (no boto3-stubs dependency).
[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

# windows_toasts wraps dynamic WinRT/winsdk bindings without complete stubs.
[[tool.mypy.overrides]]
module = [
    "windows_toasts.*",
    "winrt.*",
]
ignore_missing_imports = true
